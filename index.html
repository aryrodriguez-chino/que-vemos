<style>
  :root{
    --bg:#0A0B10; --surface:#141826; --surface2:#1B2030; --line:#262C40;
    --text:#F2F3F7; --dim:#8A90A6; --accent:#44DACD; --accent-dim:rgba(68,218,205,.24);
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Bitter',Georgia,serif;
    -webkit-font-smoothing:antialiased; overscroll-behavior:none;
  }
  svg.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;vertical-align:middle;}
  .app{display:flex; flex-direction:column; height:100vh; height:100dvh;}
  header{
    padding:calc(20px + env(safe-area-inset-top,0px)) 20px 16px;
    display:flex; align-items:center; gap:8px; flex-shrink:0;
  }
  header .logo{
    font-weight:800; font-size:26px; letter-spacing:-.01em; color:var(--accent);
    display:flex; align-items:center; gap:8px;
  }
  header .logo svg{width:26px;height:26px;stroke:var(--accent);}
  main{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:4px 20px 100px;}
  nav.tabs{
    position:fixed; left:0; right:0; bottom:0; display:flex;
    background:rgba(10,11,16,.94); backdrop-filter:blur(14px);
    border-top:1px solid var(--line);
    padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));
    z-index:20;
  }
  nav.tabs button{
    flex:1; background:none; border:none; color:var(--dim);
    font-family:inherit; font-size:12px; font-weight:600;
    display:flex; flex-direction:column; align-items:center; gap:5px;
    padding:8px 4px; border-radius:14px; cursor:pointer;
  }
  nav.tabs button svg{stroke:var(--dim);}
  nav.tabs button.active{color:var(--accent); background:var(--accent-dim);}
  nav.tabs button.active svg{stroke:var(--accent);}

  h1.page-title{font-size:22px; font-weight:700; margin:10px 0 16px; letter-spacing:-.01em;}
  input[type=text], input[type=number], select{
    width:100%; background:var(--surface); border:1px solid var(--line); color:var(--text);
    padding:14px 16px; border-radius:14px; font-family:inherit; font-size:15px; outline:none;
  }
  input::placeholder{color:var(--dim);}
  input:focus, select:focus{border-color:var(--accent);}
  select{appearance:none; -webkit-appearance:none; background-image:none;}
  .select-wrap{position:relative;}
  .select-wrap svg{position:absolute; right:14px; top:50%; transform:translateY(-50%); pointer-events:none; stroke:var(--dim);}
  .btn{
    background:var(--accent); color:#04211D; border:none;
    padding:15px 18px; border-radius:14px; font-family:inherit; font-weight:700; font-size:16px;
    cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn.ghost{background:var(--surface2); color:var(--text);}
  .btn:disabled{opacity:.5;}
  .row{display:flex; gap:10px;}
  .segmented{display:flex; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:4px; margin-bottom:18px;}
  .segmented button{
    flex:1; border:none; background:none; color:var(--dim); font-family:inherit; font-weight:600;
    font-size:15px; padding:10px 0; border-radius:999px; cursor:pointer;
  }
  .segmented button.on{background:var(--accent-dim); color:var(--accent); border:1px solid var(--accent);}
  .chip{
    padding:9px 16px; border-radius:999px; background:var(--surface); border:1px solid var(--line);
    color:var(--dim); font-size:14px; font-weight:600; cursor:pointer; white-space:nowrap; user-select:none;
  }
  .chip.on{background:var(--accent-dim); color:var(--accent); border-color:var(--accent);}
  .chipset{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;}

  .result-card{
    display:flex; gap:12px; background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius); padding:10px; margin-bottom:10px; cursor:pointer;
  }
  .result-card img.poster{width:56px; height:84px; object-fit:cover; border-radius:8px; background:var(--surface2); flex-shrink:0;}
  .result-info{flex:1; min-width:0;}
  .result-info .title{font-weight:700; font-size:15px; line-height:1.25;}
  .result-info .meta{color:var(--dim); font-size:12.5px; margin-top:2px;}
  .provs{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap;}
  .provs img{width:26px; height:26px; border-radius:7px;}
  .provs .none{color:var(--dim); font-size:12px;}

  .grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  .grid .poster-wrap{position:relative; border-radius:10px; overflow:hidden; background:var(--surface); aspect-ratio:2/3;}
  .grid .poster-wrap img{width:100%; height:100%; object-fit:cover; display:block;}
  .grid .poster-wrap .badge{position:absolute; bottom:5px; left:5px; display:flex; gap:3px;}
  .grid .poster-wrap .badge img{width:16px; height:16px; border-radius:4px;}
  .grid .cap{font-size:11.5px; margin-top:5px; color:var(--dim); line-height:1.2;}

  .platform-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:6px;}
  .platform-tile{
    aspect-ratio:1; background:var(--surface); border:1px solid var(--line); border-radius:16px;
    display:flex; align-items:center; justify-content:center; text-align:center; cursor:pointer;
    font-weight:700; font-size:17px; padding:8px; line-height:1.15;
  }
  .platform-tile:active{background:var(--surface2);}

  .empty{color:var(--dim); text-align:center; padding:60px 20px; font-size:14px; line-height:1.5;}
  .empty svg{width:38px; height:38px; stroke:var(--dim); margin-bottom:10px;}
  .loading{text-align:center; color:var(--dim); padding:30px; font-size:13.5px;}

  .group-title{font-size:13px; font-weight:700; color:var(--dim); text-transform:uppercase; letter-spacing:.04em; margin:20px 0 10px;}
  .group-title:first-child{margin-top:0;}
  .wish-item{display:flex; gap:12px; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:10px; margin-bottom:8px;}
  .wish-item img{width:44px; height:66px; object-fit:cover; border-radius:6px; flex-shrink:0; background:var(--surface2);}
  .wish-item .t{flex:1; min-width:0;}
  .wish-item .t .n{font-weight:700; font-size:14.5px;}
  .wish-item .t .n.watched{color:var(--dim); text-decoration:line-through;}
  .wish-item .t .y{color:var(--dim); font-size:12px; margin-top:2px;}
  .wish-item .actions{display:flex; gap:12px; flex-shrink:0;}
  .icon-btn{background:none; border:none; color:var(--dim); padding:4px; cursor:pointer; display:flex;}
  .icon-btn svg{stroke:var(--dim);}
  .icon-btn.checked svg{stroke:var(--accent);}
  .icon-btn.checked{color:var(--accent);}

  .modal-bg{position:fixed; inset:0; background:rgba(4,5,8,.75); backdrop-filter:blur(4px); z-index:30; display:flex; align-items:flex-end;}
  .modal{background:var(--surface); width:100%; border-radius:20px 20px 0 0; padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px)); max-height:85vh; overflow-y:auto; position:relative;}
  .modal .hero{display:flex; gap:14px; margin-bottom:14px;}
  .modal .hero img{width:90px; height:135px; object-fit:cover; border-radius:10px; background:var(--surface2);}
  .modal h2{font-size:18px; margin:0 0 4px; font-weight:700;}
  .modal .meta{color:var(--dim); font-size:13px;}
  .modal .overview{font-size:13.5px; color:var(--dim); line-height:1.5; margin:14px 0; font-family:system-ui,sans-serif;}
  .modal .provs-block{margin-top:10px;}
  .modal .provs-row{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
  .modal .provs-row img{width:32px; height:32px; border-radius:8px;}
  .modal .provs-row span{font-size:14px; font-weight:600;}
  .close-x{position:absolute; top:14px; right:16px; background:var(--surface2); border:none; color:var(--text); width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center;}

  .setup{padding:26px 24px; display:flex; flex-direction:column; gap:16px; justify-content:center; height:100%;}
  .setup .logo-big{font-size:28px; font-weight:800; color:var(--accent); display:flex; align-items:center; gap:8px;}
  .setup .logo-big svg{width:28px;height:28px;stroke:var(--accent);}
  .setup p{color:var(--dim); font-size:14px; line-height:1.6; margin:0; font-family:system-ui,sans-serif;}
  .setup a{color:var(--accent);}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
const ICONS = {
  search: `<svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="20" y1="20" x2="16.5" y2="16.5"/></svg>`,
  grid: `<svg class="ic" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>`,
  list: `<svg class="ic" viewBox="0 0 24 24"><path d="M9 6h11"/><path d="M9 12h11"/><path d="M9 18h11"/><path d="M4 6l1 1 2-2"/><path d="M4 12l1 1 2-2"/><path d="M4 18l1 1 2-2"/></svg>`,
  film: `<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="8" y1="4" x2="8" y2="9"/><line x1="16" y1="4" x2="16" y2="9"/><line x1="8" y1="15" x2="8" y2="20"/><line x1="16" y1="15" x2="16" y2="20"/></svg>`,
  chevron: `<svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>`,
  plus: `<svg class="ic" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`,
  x: `<svg class="ic" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`,
  trash: `<svg class="ic" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>`,
  checkSquare: `<svg class="ic" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><polyline points="8 12 11 15 16 9"/></svg>`,
  square: `<svg class="ic" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/></svg>`,
  clapperboard: `<svg viewBox="0 0 24 24" width="30" height="30" stroke="var(--dim)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20.2 6 3 11l-.9-2.4c-.3-1.1.4-2.2 1.5-2.5l13.5-3.6c1.1-.3 2.2.4 2.5 1.5Z"/><path d="M6.2 5.3 5 7.4"/><path d="M11 4 9.8 6.1"/><path d="M15.8 2.7 14.6 4.8"/><path d="M3 11h18v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>`,
  search2: `<svg viewBox="0 0 24 24" width="34" height="34" stroke="var(--dim)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="20" y1="20" x2="16.5" y2="16.5"/></svg>`,
  compass: `<svg viewBox="0 0 24 24" width="34" height="34" stroke="var(--dim)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polygon points="14.5 9.5 12 12 9.5 14.5 12 12 14.5 9.5"/></svg>`,
  meh: `<svg viewBox="0 0 24 24" width="34" height="34" stroke="var(--dim)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="8" y1="15" x2="16" y2="15"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>`,
};

const TMDB_KEY = "827ec177c29b8127d7972326bf67fb27";

const TMDB = "https://api.themoviedb.org/3";
const IMG = "https://image.tmdb.org/t/p/w342";
const IMG_LOGO = "https://image.tmdb.org/t/p/w92";
const REGION = "AR";

// Las 6 plataformas fijas de la app, con su color de marca y match para los nombres de TMDB
const PLATFORMS = [
  { key:"netflix",  label:"Netflix",     short:"N",    color:"#E50914", match:n=>n.includes("netflix") },
  { key:"disney",   label:"Disney+",     short:"D+",   color:"#1EA9E1", match:n=>n.includes("disney") },
  { key:"hbomax",   label:"HBO Max",     short:"HBO Max", color:"#6FB6E8", match:n=>n.includes("max") && !n.includes("paramount") },
  { key:"prime",    label:"Prime Video", short:"Prime Video", color:"#1F9AE0", match:n=>n.includes("prime video") },
  { key:"appletv",  label:"Apple TV",    short:"AppleTV", color:"#F2F2F2", match:n=>n.includes("apple tv") },
  { key:"paramount",label:"Paramount+",  short:"Paramount+", color:"#9AAE64", match:n=>n.includes("paramount") },
];

const GENRES_MOVIE = {28:"Acción",12:"Aventura",16:"Animación",35:"Comedia",80:"Crimen",99:"Documental",18:"Drama",10751:"Familia",14:"Fantasía",36:"Historia",27:"Terror",10402:"Música",9648:"Misterio",10749:"Romance",878:"Ciencia ficción",53:"Thriller",10752:"Bélica",37:"Western"};
const GENRES_TV = {10759:"Acción y aventura",16:"Animación",35:"Comedia",80:"Crimen",99:"Documental",18:"Drama",10751:"Familia",9648:"Misterio",10765:"Ciencia ficción",10768:"Bélica",37:"Western",10762:"Infantil",10766:"Telenovela"};

let state = { key: TMDB_KEY || localStorage.getItem("tmdb_key") || "", tab:"buscar", providersCache:null, wish: JSON.parse(localStorage.getItem("wishlist")||"[]") };

function saveWish(){ localStorage.setItem("wishlist", JSON.stringify(state.wish)); }

async function tmdb(path, params={}){
  const url = new URL(TMDB+path);
  url.searchParams.set("api_key", state.key);
  url.searchParams.set("language","es-AR");
  for(const k in params) if(params[k]!==undefined && params[k]!=="") url.searchParams.set(k, params[k]);
  const res = await fetch(url);
  if(!res.ok) throw new Error("TMDB error "+res.status);
  return res.json();
}

async function getProviders(id, type){
  const data = await tmdb(`/${type}/${id}/watch/providers`);
  const ar = data.results && data.results.AR;
  if(!ar) return {flatrate:[], other:[]};
  const filt = list => (list||[]).filter(p => PLATFORMS.some(pl => pl.match(p.provider_name.toLowerCase())));
  return { flatrate: filt(ar.flatrate), other: filt([...(ar.rent||[]), ...(ar.buy||[])]) };
}

// Mapea las 6 plataformas fijas a sus provider_id + logo reales de TMDB para AR
async function getPlatformMeta(type){
  if(state.platformMetaCache && state.platformMetaCache[type]) return state.platformMetaCache[type];
  const data = await tmdb(`/watch/providers/${type}`, {watch_region:REGION});
  const list = data.results || [];
  const map = {};
  PLATFORMS.forEach(pl=>{
    const found = list.find(p => pl.match(p.provider_name.toLowerCase()));
    if(found) map[pl.key] = { id: found.provider_id, logo: found.logo_path };
  });
  state.platformMetaCache = state.platformMetaCache || {};
  state.platformMetaCache[type] = map;
  return map;
}
async function getPlatformIds(type){
  const meta = await getPlatformMeta(type);
  const map = {};
  for(const k in meta) map[k] = meta[k].id;
  return map;
}

function providerBadges(list, size=26){
  if(!list.length) return `<span class="none">No disponible en streaming</span>`;
  return list.map(p=>`<img title="${p.provider_name}" src="${IMG_LOGO}${p.logo_path}" style="width:${size}px;height:${size}px">`).join("");
}

function render(){
  const app = document.getElementById("app");
  if(!state.key){ app.innerHTML = setupView(); bindSetup(); return; }
  app.innerHTML = `
    <header><div class="logo">${ICONS.film}Ke vemo?</div></header>
    <main id="main"></main>
    <nav class="tabs">
      <button data-tab="buscar" class="${state.tab==='buscar'?'active':''}">${ICONS.search}Buscar</button>
      <button data-tab="explorar" class="${state.tab==='explorar'?'active':''}">${ICONS.grid}Explorar</button>
      <button data-tab="lista" class="${state.tab==='lista'?'active':''}">${ICONS.list}Mi lista</button>
    </nav>
  `;
  document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab; render();});
  const main = document.getElementById("main");
  if(state.tab==="buscar") viewBuscar(main);
  if(state.tab==="explorar") viewExplorar(main);
  if(state.tab==="lista") viewLista(main);
}

function setupView(){
  return `<div class="setup">
    <div class="logo-big">${ICONS.film}Ke vemo?</div>
    <p>Para funcionar necesita una API key gratuita de TMDB (The Movie Database).<br><br>
    Entrá a <a href="https://www.themoviedb.org/settings/api" target="_blank">themoviedb.org/settings/api</a>, generá una key y pegala acá abajo. Queda guardada solo en este teléfono.</p>
    <input type="text" id="keyInput" placeholder="Pegá tu API key de TMDB">
    <button class="btn" id="saveKey">Guardar y continuar</button>
  </div>`;
}
function bindSetup(){
  document.getElementById("saveKey").onclick = ()=>{
    const v = document.getElementById("keyInput").value.trim();
    if(!v) return;
    state.key = v; localStorage.setItem("tmdb_key", v); render();
  };
}

// ---------- BUSCAR ----------
function viewBuscar(main){
  main.innerHTML = `
    <h1 class="page-title">Buscar</h1>
    <input type="text" id="searchInput" placeholder="Título de película o serie...">
    <div id="searchResults"></div>
  `;
  const input = document.getElementById("searchInput");
  let t;
  input.oninput = ()=>{ clearTimeout(t); t=setTimeout(()=>doSearch(input.value),450); };
  document.getElementById("searchResults").innerHTML = platformGridView();
  bindPlatformGrid();
}
function platformGridView(){
  return `<div class="platform-grid">${PLATFORMS.map(p=>`
    <div class="platform-tile" data-key="${p.key}" id="tile-${p.key}" style="color:${p.color}">${p.short}</div>
  `).join("")}</div>`;
}
function bindPlatformGrid(){
  document.querySelectorAll(".platform-tile").forEach(t=>{
    t.onclick = ()=>{
      explState.platformKeys = new Set([t.dataset.key]);
      state.tab = "explorar";
      render();
      setTimeout(runExplore, 50);
    };
  });
  loadPlatformLogos();
}
async function loadPlatformLogos(){
  try{
    const meta = await getPlatformMeta("movie");
    PLATFORMS.forEach(p=>{
      const tile = document.getElementById(`tile-${p.key}`);
      const logo = meta[p.key] && meta[p.key].logo;
      if(tile && logo){
        tile.innerHTML = `<img src="${IMG_LOGO}${logo}" alt="${p.label}" style="width:56px;height:56px;object-fit:contain;border-radius:12px;">`;
        tile.style.color = "";
      }
    });
  }catch(e){ /* si falla, se quedan las siglas de respaldo */ }
}
async function doSearch(q){
  const box = document.getElementById("searchResults");
  if(!q || q.trim().length<2){ box.innerHTML = platformGridView(); bindPlatformGrid(); return; }
  box.innerHTML = `<div class="loading">Buscando...</div>`;
  try{
    const data = await tmdb("/search/multi", {query:q, region:REGION, include_adult:false});
    const items = (data.results||[]).filter(r=>(r.media_type==="movie"||r.media_type==="tv") && r.poster_path).slice(0,12);
    if(!items.length){ box.innerHTML = `<div class="empty">${ICONS.meh}No encontramos nada con ese nombre</div>`; return; }
    box.innerHTML = items.map(i=>cardSkeleton(i)).join("");
    items.forEach(i=>loadCardProviders(i));
  }catch(e){ box.innerHTML = `<div class="empty">Ocurrió un error consultando TMDB. Revisá tu API key.</div>`; }
}
function cardSkeleton(i){
  const title = i.title||i.name;
  const year = (i.release_date||i.first_air_date||"").slice(0,4);
  return `<div class="result-card" data-id="${i.id}" data-type="${i.media_type}">
    <img class="poster" src="${IMG}${i.poster_path}">
    <div class="result-info">
      <div class="title">${title}</div>
      <div class="meta">${i.media_type==='movie'?'Película':'Serie'}${year?' · '+year:''}</div>
      <div class="provs" id="prov-${i.media_type}-${i.id}"><span class="none">Cargando...</span></div>
    </div>
  </div>`;
}
async function loadCardProviders(i){
  const el = document.getElementById(`prov-${i.media_type}-${i.id}`);
  if(!el) return;
  try{
    const p = await getProviders(i.id, i.media_type);
    el.innerHTML = p.flatrate.length ? providerBadges(p.flatrate) : (p.other.length ? providerBadges(p.other) : `<span class="none">No disponible en streaming AR</span>`);
  }catch(e){ el.innerHTML = `<span class="none">—</span>`; }
  const card = el.closest(".result-card");
  if(card) card.onclick = ()=>openDetail(i.id, i.media_type);
}

// ---------- EXPLORAR ----------
let explState = {type:"movie", genre:"", year:"", platformKeys: new Set()};
async function viewExplorar(main){
  main.innerHTML = `
    <h1 class="page-title">Explorar</h1>
    <div class="segmented" id="typeSeg">
      <button class="${explState.type==='movie'?'on':''}" data-type="movie">Películas</button>
      <button class="${explState.type==='tv'?'on':''}" data-type="tv">Series</button>
    </div>
    <div class="row" style="margin-bottom:12px;">
      <div class="select-wrap" style="flex:1"><select id="genreSel"></select>${ICONS.chevron}</div>
      <input type="number" id="yearInput" placeholder="Año" style="width:100px" value="${explState.year}">
    </div>
    <div class="chipset" id="provChips"></div>
    <button class="btn" id="exploreBtn" style="width:100%; margin-bottom:16px">Buscar</button>
    <div id="exploreResults"></div>
  `;
  fillGenreSelect();
  document.querySelectorAll("#typeSeg button").forEach(c=>c.onclick=()=>{
    explState.type = c.dataset.type;
    viewExplorar(main);
  });
  document.getElementById("yearInput").oninput = e=> explState.year = e.target.value;
  renderProvChips();
  document.getElementById("exploreBtn").onclick = runExplore;
  document.getElementById("exploreResults").innerHTML = `<div class="empty">${ICONS.compass}Elegí filtros y tocá Buscar</div>`;
}
function fillGenreSelect(){
  const g = explState.type==='movie' ? GENRES_MOVIE : GENRES_TV;
  const sel = document.getElementById("genreSel");
  sel.innerHTML = `<option value="">Cualquier género</option>` + Object.entries(g).map(([id,name])=>`<option value="${id}" ${explState.genre==id?'selected':''}>${name}</option>`).join("");
  sel.onchange = e=> explState.genre = e.target.value;
}
function renderProvChips(){
  const box = document.getElementById("provChips");
  if(!box) return;
  const allOn = explState.platformKeys.size === 0;
  box.innerHTML = `<div class="chip ${allOn?'on':''}" data-key="_all">Todas</div>` +
    PLATFORMS.map(p=>`<div class="chip ${explState.platformKeys.has(p.key)?'on':''}" data-key="${p.key}">${p.label}</div>`).join("");
  box.querySelectorAll(".chip").forEach(c=>{
    c.onclick = ()=>{
      const key = c.dataset.key;
      if(key === "_all"){ explState.platformKeys.clear(); }
      else{
        if(explState.platformKeys.has(key)) explState.platformKeys.delete(key);
        else explState.platformKeys.add(key);
      }
      renderProvChips();
    };
  });
}
async function runExplore(){
  const box = document.getElementById("exploreResults");
  if(!box) return;
  box.innerHTML = `<div class="loading">Buscando...</div>`;
  const params = { watch_region:REGION, sort_by:"popularity.desc", include_adult:false };
  if(explState.genre) params.with_genres = explState.genre;
  if(explState.platformKeys.size){
    const idMap = await getPlatformIds(explState.type);
    const ids = [...explState.platformKeys].map(k=>idMap[k]).filter(Boolean);
    if(ids.length){ params.with_watch_providers = ids.join("|"); params.with_watch_monetization_types = "flatrate"; }
  }
  if(explState.year) params[explState.type==='movie'?'primary_release_year':'first_air_date_year'] = explState.year;
  try{
    const data = await tmdb(`/discover/${explState.type}`, params);
    const items = (data.results||[]).filter(r=>r.poster_path).slice(0,18);
    if(!items.length){ box.innerHTML = `<div class="empty">${ICONS.meh}No hay resultados con esos filtros</div>`; return; }
    box.innerHTML = `<div class="grid">${items.map(i=>gridSkeleton(i)).join("")}</div>`;
    items.forEach(i=>loadGridProviders(i));
  }catch(e){ box.innerHTML = `<div class="empty">Error consultando TMDB.</div>`; }
}
function gridSkeleton(i){
  const title = i.title||i.name;
  const year = (i.release_date||i.first_air_date||"").slice(0,4);
  return `<div>
    <div class="poster-wrap" data-id="${i.id}" data-type="${explState.type}">
      <img src="${IMG}${i.poster_path}">
      <div class="badge" id="gprov-${i.id}"></div>
    </div>
    <div class="cap">${title}${year?' · '+year:''}</div>
  </div>`;
}
async function loadGridProviders(i){
  const el = document.getElementById(`gprov-${i.id}`);
  if(!el) return;
  try{
    const p = await getProviders(i.id, explState.type);
    el.innerHTML = (p.flatrate.slice(0,3)).map(pr=>`<img src="${IMG_LOGO}${pr.logo_path}">`).join("");
    el.parentElement.onclick = ()=>openDetail(i.id, explState.type);
  }catch(e){}
}

// ---------- DETAIL MODAL ----------
async function openDetail(id, type){
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.innerHTML = `<div class="modal"><button class="close-x">${ICONS.x}</button><div class="loading">Cargando...</div></div>`;
  document.body.appendChild(bg);
  bg.onclick = e=>{ if(e.target===bg) bg.remove(); };
  bg.querySelector(".close-x").onclick = ()=>bg.remove();
  try{
    const [info, prov] = await Promise.all([tmdb(`/${type}/${id}`), getProviders(id,type)]);
    const title = info.title||info.name;
    const year = (info.release_date||info.first_air_date||"").slice(0,4);
    const runtime = type==='movie' ? (info.runtime?info.runtime+' min':'') : (info.number_of_seasons?info.number_of_seasons+' temporada(s)':'');
    bg.querySelector(".modal").innerHTML = `
      <button class="close-x">${ICONS.x}</button>
      <div class="hero">
        <img src="${IMG}${info.poster_path}">
        <div>
          <h2>${title}</h2>
          <div class="meta">${type==='movie'?'Película':'Serie'}${year?' · '+year:''}${runtime?' · '+runtime:''}</div>
          <div class="meta">⭐ ${info.vote_average?info.vote_average.toFixed(1):'—'}</div>
        </div>
      </div>
      <div class="overview">${info.overview||'Sin sinopsis disponible.'}</div>
      <div class="provs-block">
        ${prov.flatrate.length ? `<div class="group-title" style="margin-top:0">Streaming</div>` + prov.flatrate.map(p=>`<div class="provs-row"><img src="${IMG_LOGO}${p.logo_path}"><span>${p.provider_name}</span></div>`).join("") : ""}
        ${prov.other.length ? `<div class="group-title">Alquiler / Compra</div>` + prov.other.map(p=>`<div class="provs-row"><img src="${IMG_LOGO}${p.logo_path}"><span>${p.provider_name}</span></div>`).join("") : ""}
        ${(!prov.flatrate.length && !prov.other.length) ? `<div class="empty" style="padding:20px 0">No encontramos dónde verla en Argentina por streaming.</div>` : ""}
      </div>
      <button class="btn ghost" id="addWishBtn" style="width:100%;margin-top:16px">${ICONS.plus}Agregar a Mi Lista</button>
    `;
    bg.querySelector(".close-x").onclick = ()=>bg.remove();
    bg.querySelector("#addWishBtn").onclick = ()=>{
      addToWishlist({id, type, title, year, poster_path:info.poster_path, providers: prov.flatrate.map(p=>p.provider_name)});
      bg.remove();
    };
  }catch(e){ bg.querySelector(".modal").innerHTML = `<button class="close-x">${ICONS.x}</button><div class="empty">Error cargando la ficha.</div>`; bg.querySelector(".close-x").onclick=()=>bg.remove(); }
}

// ---------- MI LISTA ----------
function addToWishlist(item){
  if(state.wish.some(w=>w.id===item.id && w.type===item.type)) return;
  state.wish.unshift({...item, watched:false, addedAt:Date.now()});
  saveWish();
}
function viewLista(main){
  main.innerHTML = `
    <h1 class="page-title">Mi Lista</h1>
    <input type="text" id="wishSearch" placeholder="Escribí un título para agregarlo...">
    <div id="wishSearchResults"></div>
    <div id="wishGroups" style="margin-top:18px"></div>
  `;
  const input = document.getElementById("wishSearch");
  let t;
  input.oninput = ()=>{ clearTimeout(t); t=setTimeout(()=>doWishSearch(input.value),450); };
  renderWishGroups();
}
async function doWishSearch(q){
  const box = document.getElementById("wishSearchResults");
  if(!q || q.trim().length<2){ box.innerHTML=""; return; }
  box.innerHTML = `<div class="loading">Buscando...</div>`;
  try{
    const data = await tmdb("/search/multi", {query:q, region:REGION, include_adult:false});
    const items = (data.results||[]).filter(r=>(r.media_type==='movie'||r.media_type==='tv') && r.poster_path).slice(0,6);
    if(!items.length){ box.innerHTML = `<div class="empty">No encontramos nada</div>`; return; }
    box.innerHTML = items.map(i=>{
      const title=i.title||i.name; const year=(i.release_date||i.first_air_date||"").slice(0,4);
      return `<div class="result-card" data-id="${i.id}" data-type="${i.media_type}">
        <img class="poster" src="${IMG}${i.poster_path}">
        <div class="result-info"><div class="title">${title}</div><div class="meta">${i.media_type==='movie'?'Película':'Serie'}${year?' · '+year:''} — tocar para agregar</div></div>
      </div>`;
    }).join("");
    box.querySelectorAll(".result-card").forEach(card=>{
      card.onclick = async ()=>{
        const id=Number(card.dataset.id), type=card.dataset.type;
        const item = items.find(i=>i.id===id);
        const prov = await getProviders(id,type).catch(()=>({flatrate:[]}));
        addToWishlist({id, type, title:item.title||item.name, year:(item.release_date||item.first_air_date||"").slice(0,4), poster_path:item.poster_path, providers: prov.flatrate.map(p=>p.provider_name)});
        document.getElementById("wishSearch").value="";
        box.innerHTML="";
        renderWishGroups();
      };
    });
  }catch(e){ box.innerHTML = `<div class="empty">Error consultando TMDB.</div>`; }
}
function renderWishGroups(){
  const box = document.getElementById("wishGroups");
  if(!box) return;
  if(!state.wish.length){ box.innerHTML = `<div class="empty">${ICONS.clapperboard}Todavía no agregaste nada.<br>Escribí un título arriba para empezar.</div>`; return; }
  const groups = {};
  state.wish.forEach(w=>{
    const key = (w.providers && w.providers[0]) || "Sin plataforma / alquiler";
    groups[key] = groups[key]||[]; groups[key].push(w);
  });
  box.innerHTML = Object.entries(groups).map(([plat, items])=>`
    <div class="group-title">${plat}</div>
    ${items.map(w=>`
      <div class="wish-item">
        <img src="${w.poster_path?IMG+w.poster_path:''}">
        <div class="t">
          <div class="n ${w.watched?'watched':''}">${w.title}</div>
          <div class="y">${w.year||''} · ${w.type==='movie'?'Película':'Serie'}</div>
        </div>
        <div class="actions">
          <button class="icon-btn ${w.watched?'checked':''}" data-act="watch" data-id="${w.id}" data-type="${w.type}">${w.watched?ICONS.checkSquare:ICONS.square}</button>
          <button class="icon-btn" data-act="del" data-id="${w.id}" data-type="${w.type}">${ICONS.trash}</button>
        </div>
      </div>
    `).join("")}
  `).join("");
  box.querySelectorAll("[data-act]").forEach(btn=>{
    btn.onclick = ()=>{
      const id=Number(btn.dataset.id), type=btn.dataset.type, act=btn.dataset.act;
      const idx = state.wish.findIndex(w=>w.id===id && w.type===type);
      if(idx<0) return;
      if(act==='watch') state.wish[idx].watched = !state.wish[idx].watched;
      if(act==='del') state.wish.splice(idx,1);
      saveWish(); renderWishGroups();
    };
  });
}

render();
</script>
